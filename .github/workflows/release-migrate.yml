name: Release - Prisma Migrate Deploy

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Set to "true" to confirm DB backup and proceed with migrate deploy'
        required: true
        default: 'false'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check Prisma migration provider match
        run: |
          set -euo pipefail
          if [ ! -f prisma/schema.prisma ]; then
            echo "prisma/schema.prisma not found — aborting provider check." >&2
            exit 1
          fi
          if [ ! -f prisma/migration_lock.toml ]; then
            echo "prisma/migration_lock.toml not found — cannot verify migration provider. Aborting." >&2
            exit 1
          fi
          SCHEMA_PROVIDER=$(sed -n 's/.*provider *= *"\([^"]*\)".*/\1/p' prisma/schema.prisma | head -n 1 || true)
          LOCK_PROVIDER=$(sed -n 's/.*provider *= *"\([^"]*\)".*/\1/p' prisma/migration_lock.toml | head -n 1 || true)
          echo "Detected schema provider: ${SCHEMA_PROVIDER:-<none>}"
          echo "Detected migration_lock provider: ${LOCK_PROVIDER:-<none>}"
          if [ -z "${LOCK_PROVIDER:-}" ]; then
            echo "Could not determine provider from prisma/migration_lock.toml. This usually means migrations are missing or malformed." >&2
            echo "Aborting to avoid running migrations against an unexpected provider. See RUNBOOK.md for reconciliation steps." >&2
            exit 1
          fi
          if [ "${SCHEMA_PROVIDER}" != "${LOCK_PROVIDER}" ]; then
            echo "Provider mismatch detected:" >&2
            echo "  - prisma/schema.prisma: ${SCHEMA_PROVIDER}" >&2
            echo "  - prisma/migration_lock.toml: ${LOCK_PROVIDER}" >&2
            echo "Action: Do NOT run 'prisma migrate deploy' from this workflow until migration history is reconciled." >&2
            echo "Recommended: backup DB, reconcile migrations for the target provider (see RUNBOOK.md / CI_SETUP.md), then re-run the release workflow." >&2
            exit 1
          fi
          echo "Prisma provider check passed — schema and migration_lock match: ${SCHEMA_PROVIDER}"

      - name: Require backup confirmation
        run: |
          if [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "This workflow requires you to confirm that a DB backup/snapshot has been taken." >&2
            echo "Rerun and set input 'force' to 'true' after completing backups and maintenance window." >&2
            exit 1
          fi

      - name: Run Prisma migrations (deploy)
        run: npx prisma migrate deploy

      - name: Run quick admin smoke test
        run: npm run smoke:admin -- --json
